[project]
name = "multi-agent-coding"
version = "0.1.0"
description = "Autonomous Multi-Agent Coding System — Gemma3:12b, fully local, proof-generating"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.10",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.6",
    "tiktoken>=0.13.0",
    "rich>=15.0.0",
    "langchain-anthropic>=1.4.6",
    "python-dotenv>=1.2.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["system", "proof", "run"]

[tool.pytest.ini_options]
norecursedirs = ["workspace", "proofs", ".git", "__pycache__"]
