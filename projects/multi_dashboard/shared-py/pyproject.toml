[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-shared"
version = "0.1.0"
description = "Cross-cutting library for the fullstack_chatbot_llm Python backends."
requires-python = ">=3.11"
authors = [{ name = "mihirzz" }]
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "python-json-logger>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "pymongo>=4.9,<5",
]

[project.optional-dependencies]
sql = ["asyncpg>=0.29,<1", "aiosqlite>=0.20,<1"]
testing = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<0.28",
    "aiosqlite>=0.20,<1",
    "mongomock-motor>=0.0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
