[project]
name = "oncall"
version = "0.1.0"
description = "Long-running on-call incident agent: Deep Agents + ScaleDown context middleware, durable runs, measured."
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.24",
    "langchain==1.4.5",
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.3",
    "langchain-ollama==1.1.0",
    "ollama==0.6.3",
    "langchain-scaledown==0.2.0",
    "psycopg[binary,pool]==3.3.6",
    "redis==8.1.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.5.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "tiktoken==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
