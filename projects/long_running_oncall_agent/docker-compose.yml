name: oncall

x-app: &app
  build: .
  image: oncall-app:dev
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://oncall:oncall@postgres:5432/oncall
    REDIS_URL: redis://redis:6379/0
    PRODSIM_URL: http://prodsim:8100
    API_URL: http://api:8000
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    AGENT_MODEL: ${AGENT_MODEL:-qwen3:8b}
    JUDGE_MODEL: ${JUDGE_MODEL:-qwen3:1.7b}
    AGENT_NUM_CTX: ${AGENT_NUM_CTX:-32768}
    MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-40}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall -d oncall"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8.6.7
    # AOF so the run stream and its pending-entries list survive a redis restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # CPU-only inference: Docker on macOS has no Metal passthrough, which is the point.
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      # Reuse models already pulled on the host; no multi-GB re-download.
      - ${OLLAMA_MODELS_DIR:-${HOME}/.ollama/models}:/root/.ollama/models
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time: honest, comparable latencies
      OLLAMA_MAX_LOADED_MODELS: "2"   # agent model + judge model
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"    # halves KV memory at 32k context
    # 11435 on the host so it never collides with a native Ollama app on 11434.
    ports: ["${OLLAMA_HOST_PORT:-11435}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${AGENT_MODEL:-qwen3:8b} && ollama pull ${JUDGE_MODEL:-qwen3:1.7b}"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  prodsim:
    <<: *app
    command: ["uvicorn", "oncall.prodsim.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 3s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "oncall.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta')"]
      interval: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "oncall.worker.main"]
    deploy:
      replicas: 2
    stop_grace_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      prodsim: {condition: service_healthy}
      ollama-pull: {condition: service_completed_successfully}

  # One-shot measurement runner: `docker compose --profile bench run --rm bench ...`
  bench:
    <<: *app
    profiles: ["bench"]
    command: ["python", "-m", "oncall.bench.run_matrix"]
    volumes: ["./results:/app/results"]
    restart: "no"
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
